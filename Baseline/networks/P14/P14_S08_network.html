
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Interactive Process Network</title>
    <script src="https://unpkg.com/cytoscape@3.21.1/dist/cytoscape.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #cy {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .legend {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 10;
        }
        .tooltip {
            position: absolute;
            background: #fefefe;
            border: 1px solid #aaa;
            padding: 10px;
            font-family: sans-serif;
            font-size: 13px;
            max-width: 300px;
            z-index: 20;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            cursor: default;
        }
        .tooltip .close-btn {
            float: right;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="cy"></div>
    <div class="legend">
        <b>Legend</b><br>
        <span style="color:#e74c3c;">Red</span>: Excitatory<br>
        <span style="color:#3498db;">Blue</span>: Inhibitory<br>
        <hr style="border-top: 1px dashed #aaa; margin: 4px 0;">
        Dashed line = Weak<br>
        Solid thin = Moderate<br>
        Solid thick = Strong<br>
        <hr>
        <b>Dimensions</b><br>
        🔴 Cognition<br>
        🟠 Attention<br>
        🟡 Motivation<br>
        🟢 (Overt) Behaviour<br>
        🔵 Sense of Self<br>
        🟣 Context/Moderators<br>
        🟤 Affect<br>
        ⚪ Sociocultural<br>
        ⚫ Biophysiological
    </div>
    <script>
        var cy = cytoscape({
            container: document.getElementById('cy'),
            layout: { name: 'cose' },
            style: [
                {

                    style: {

                        'text-wrap': 'wrap',
                        'text-max-width': 100,
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'background-color': '#ffffff',
                        'border-color': '#000000',
                        'border-width': 1,
                        'color': '#000',
                        'font-size': 10,
                        'width': 'label',
                        'height': 'label',
                        'padding': 10
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'curve-style': 'bezier',
                        'target-arrow-shape': 'triangle',
                        'arrow-scale': 1.2,
                        'label': '',
                        'font-size': 9,
                        'text-rotation': 'autorotate',
                        'text-margin-y': -10,
                        'line-color': 'data(color)',
                        'target-arrow-color': 'data(color)',
                        'width': 'data(width)',
                        'line-style': 'data(lineStyle)'
                    }
                }
            ],
            elements: [{"data": {"id": "Theme 1", "label": "Emotional Awareness and Regulation\n\ud83d\udfe2 \ud83d\udfe4 \ud83d\udfe0\nFrequency: 4"}}, {"data": {"id": "Theme 2", "label": "Self-Doubt and Fear of Failure\n\ud83d\udfe4 \ud83d\udfe0 \ud83d\udd34\nFrequency: 4"}}, {"data": {"id": "Theme 3", "label": "Family Dynamics and Financial Stress\n\ud83d\udfe2 \ud83d\udfe4 \ud83d\udfe0\nFrequency: 43"}}, {"data": {"id": "Theme 4", "label": "Seeking Support and Guidance\n\ud83d\udfe2 \ud83d\udd34\nFrequency: 4"}}, {"data": {"id": "Theme 1_Theme 2_Theme 1-Theme 2", "source": "Theme 1", "target": "Theme 2", "pair_label": "Theme 1-Theme 2", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Emotional awareness and regulation can exacerbate self-doubt\nand fear of failure.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 1_Theme 3_Theme 1-Theme 3", "source": "Theme 1", "target": "Theme 3", "pair_label": "Theme 1-Theme 3", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Emotional awareness and regulation can be impacted by family\ndynamics and financial stress.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 3_Theme 1_Theme 3-Theme 1", "source": "Theme 3", "target": "Theme 1", "pair_label": "Theme 3-Theme 1", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Family dynamics and financial stress can affect emotional\nawareness and regulation.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 2_Theme 3_Theme 2-Theme 3", "source": "Theme 2", "target": "Theme 3", "pair_label": "Theme 2-Theme 3", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Self-doubt and fear of failure can be triggered by family\ndynamics and financial stress.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 3_Theme 2_Theme 3-Theme 2", "source": "Theme 3", "target": "Theme 2", "pair_label": "Theme 3-Theme 2", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Family dynamics and financial stress can contribute to self-\ndoubt and fear of failure.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 1_Theme 4_Theme 1-Theme 4", "source": "Theme 1", "target": "Theme 4", "pair_label": "Theme 1-Theme 4", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Emotional awareness and regulation can be facilitated by\nseeking support and guidance.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 4_Theme 1_Theme 4-Theme 1", "source": "Theme 4", "target": "Theme 1", "pair_label": "Theme 4-Theme 1", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Seeking support and guidance can enhance emotional awareness\nand regulation.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 2_Theme 4_Theme 2-Theme 4", "source": "Theme 2", "target": "Theme 4", "pair_label": "Theme 2-Theme 4", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Self-doubt and fear of failure can be alleviated by seeking\nsupport and guidance.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 4_Theme 2_Theme 4-Theme 2", "source": "Theme 4", "target": "Theme 2", "pair_label": "Theme 4-Theme 2", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Seeking support and guidance can help mitigate self-doubt\nand fear of failure.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 3_Theme 4_Theme 3-Theme 4", "source": "Theme 3", "target": "Theme 4", "pair_label": "Theme 3-Theme 4", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Family dynamics and financial stress can be addressed by\nseeking support and guidance.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}, {"data": {"id": "Theme 4_Theme 3_Theme 4-Theme 3", "source": "Theme 4", "target": "Theme 3", "pair_label": "Theme 4-Theme 3", "info": "<b>Type:</b> Excitatory<br><b>Strength:</b> Strong<br><b>Explanation:</b><br>Seeking support and guidance can help navigate family\ndynamics and financial stress.", "color": "#3498db", "width": 4, "lineStyle": "solid"}}]
        });

        let tooltipCounter = 0;

        cy.on('tap', 'edge', function(evt) {
            var edge = evt.target;
            var pos = evt.renderedPosition;
            var tooltipId = "tooltip-" + (++tooltipCounter);

            var tooltip = document.createElement("div");
            tooltip.className = "tooltip";
            tooltip.id = tooltipId;
            tooltip.style.left = (pos.x + 20) + "px";
            tooltip.style.top = (pos.y + 20) + "px";

            var closeBtn = document.createElement("span");
            closeBtn.className = "close-btn";
            closeBtn.innerHTML = "&times;";
            closeBtn.onclick = function () {
                tooltip.remove();
            };

            tooltip.innerHTML = "";
            tooltip.appendChild(closeBtn);
            var content = document.createElement("div");
            content.innerHTML = edge.data("info");
            tooltip.appendChild(content);

            document.body.appendChild(tooltip);
            makeDraggable(tooltip);
        });

        function makeDraggable(elmnt) {
            let offset = { x: 0, y: 0 };
            let isDragging = false;

            elmnt.addEventListener("mousedown", function (e) {
                if (e.target.classList.contains("close-btn")) return;
                isDragging = true;
                offset.x = e.clientX - elmnt.offsetLeft;
                offset.y = e.clientY - elmnt.offsetTop;
                elmnt.style.cursor = "move";
                e.preventDefault();
            });

            document.addEventListener("mousemove", function (e) {
                if (isDragging) {
                    elmnt.style.left = (e.clientX - offset.x) + "px";
                    elmnt.style.top = (e.clientY - offset.y) + "px";
                }
            });

            document.addEventListener("mouseup", function () {
                isDragging = false;
                elmnt.style.cursor = "default";
            });
        }
    </script>
</body>
</html>
